---
- name: "Adding the Ceph repository"
  when: is_ceph_server | default(false)
  ansible.builtin.deb822_repository:
    name: "ceph-no-subscription"
    state: "present"
    uris: "http://download.proxmox.com/debian/ceph-tentacle"
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - "no-subscription"
    signed_by: "/usr/share/keyrings/proxmox-archive-keyring.gpg"
    mode: "0644"

- name: "Installing the Ceph packages"
  when: is_ceph_server | default(false)
  ansible.builtin.import_role:
    name: "common"
    tasks_from: "debian/packages/apt"
  vars:
    update_cache: true
    packages:
      - { name: "ceph" }

- name: "Initializing Ceph"
  # No native Ansible module exists for pveceph.
  delegate_to: "{{ ceph_master_node }}"
  run_once: true
  ansible.builtin.command: "pveceph init --network {{ ceph_ip_and_netmask | default(cluster_ip_and_netmask) }}"
  args:
    creates: "/etc/pve/ceph.conf"

- name: "Setting the default Ceph pool size"
  delegate_to: "{{ ceph_master_node }}"
  run_once: true
  ansible.builtin.lineinfile:
    path: "/etc/ceph/ceph.conf"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: "present"
  loop:
    - regexp: '^\s*osd_pool_default_size\s*=.*$'
      line: "        osd_pool_default_size = 2"
    - regexp: '^\s*osd_pool_default_min_size\s*=.*$'
      line: "        osd_pool_default_min_size = 1"
  loop_control:
    label: "{{ item.line }}"

- name: "Creating the monitor"
  when: is_ceph_server | default(false)
  # No native Ansible module exists for pveceph.
  ansible.builtin.command: "pveceph mon create"
  args:
    creates: "/var/lib/ceph/mon/ceph-{{ ansible_facts['hostname'] }}"
  throttle: 1

- name: "Creating the manager"
  when: is_ceph_server | default(false)
  # The first monitor creates a manager automatically.
  ansible.builtin.command: "pveceph mgr create"
  args:
    creates: "/var/lib/ceph/mgr/ceph-{{ ansible_facts['hostname'] }}"
  throttle: 1

- name: "Creating the Metadata Server (MDS)"
  when: is_ceph_server | default(false)
  # No native Ansible module exists for pveceph.
  ansible.builtin.command: "pveceph mds create"
  args:
    creates: "/var/lib/ceph/mds/ceph-{{ ansible_facts['hostname'] }}"
  throttle: 1

- name: "Checking the OSD devices"
  when: is_ceph_server | default(false)
  # No native Ansible module exists for ceph-volume.
  ansible.builtin.command: "ceph-volume lvm list"
  register: "osd_status"
  changed_when: false
  failed_when:
    - osd_status.rc != 0
    - "'No valid Ceph lvm devices found' not in osd_status.stderr"

- name: "Creating the OSDs"
  when:
    - is_ceph_server | default(false)
    - item.name not in osd_status.stdout
  # No native Ansible module exists for pveceph.
  ansible.builtin.command: >-
    pveceph osd create {{ item.name }}
    --crush-device-class {{ item.type }}
    {{ ('--db_dev ' + item.db) if item.db is defined else '' }}
  loop: "{{ ceph_devices | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  throttle: 1
  register: "osd_creation"
  changed_when: osd_creation.rc == 0

- name: "Listing the CRUSH rules"
  # No native Ansible module exists for ceph osd crush rule ls.
  delegate_to: "{{ ceph_master_node }}"
  run_once: true
  ansible.builtin.command: "ceph osd crush rule ls"
  register: "crush_rules"
  changed_when: false

- name: "Creating the CRUSH rules"
  when: item.name not in crush_rules.stdout_lines
  # No native Ansible module exists for ceph osd crush rule create-replicated.
  ansible.builtin.command: "ceph osd crush rule create-replicated {{ item.name }} default host {{ item.type }}"
  loop: "{{ ceph_crush_rules | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ ceph_master_node }}"
  run_once: true
  register: "crush_rule_creation"
  changed_when: crush_rule_creation.rc == 0

- name: "Listing the Ceph file systems"
  delegate_to: "{{ ceph_master_node }}"
  run_once: true
  ansible.builtin.command: "ceph fs ls -f json"
  register: "ceph_file_system_status"
  changed_when: false

- name: "Creating the Ceph file systems"
  when: item.name not in (ceph_file_system_status.stdout | from_json | map(attribute='name') | list)
  # No native Ansible module exists for pveceph.
  ansible.builtin.command: "pveceph fs create --name {{ item.name }} --pg_num {{ item.pg_num }} --add-storage"
  loop: "{{ ceph_file_systems | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ ceph_master_node }}"
  run_once: true
  register: "ceph_fs_creation"
  changed_when: ceph_fs_creation.rc == 0

- name: "Listing the Ceph pools"
  delegate_to: "{{ ceph_master_node }}"
  run_once: true
  ansible.builtin.command: "ceph osd pool ls"
  register: "ceph_pools_status"
  changed_when: false

- name: "Creating the Ceph pools"
  when: item.name not in ceph_pools_status.stdout_lines
  # No native Ansible module exists for pveceph.
  ansible.builtin.command: >-
    pveceph pool create {{ item.name }}
    --size {{ item.size }}
    --min_size {{ item.min_size }}
    --crush_rule {{ item.crush_rule }}
    {{ ('--pg_num ' + (item.pg_num | string)) if item.pg_num is defined else '' }}
    {{ ('--pg_autoscale_mode ' + item.pg_autoscale_mode) if item.pg_autoscale_mode is defined else '' }}
    {{ '--add_storages' if item.add_storages | default(false) else '' }}
  loop: "{{ ceph_pools | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ ceph_master_node }}"
  run_once: true
  register: "ceph_pool_creation"
  changed_when: ceph_pool_creation.rc == 0

- name: "Setting the Ceph pool options"
  # Proxmox compares each requested option with its current value.
  ansible.builtin.command: >-
    pveceph pool set {{ item.name }}
    --crush_rule {{ item.crush_rule }}
    {{ ('--size ' + (item.size | string)) if item.size is defined else '' }}
    {{ ('--min_size ' + (item.min_size | string)) if item.min_size is defined else '' }}
    {{ ('--pg_num ' + (item.pg_num | string)) if item.pg_num is defined else '' }}
    {{ ('--pg_autoscale_mode ' + item.pg_autoscale_mode) if item.pg_autoscale_mode is defined else '' }}
  loop: "{{ (ceph_pools | default([])) + (ceph_default_pools_crush_rule | default([])) }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: "{{ ceph_master_node }}"
  run_once: true
  register: "pool_settings"
  changed_when: "'applying' in pool_settings.stdout"
