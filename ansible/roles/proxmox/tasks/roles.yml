---
- name: "Creating the roles"
  run_once: true
  # community.proxmox.proxmox_role not yet installed; deferring to pveum command.
  ansible.builtin.command: "pveum roleadd {{ item.name }} -privs '{{ item.privileges }}'"
  register: "create_role"
  changed_when: create_role.rc == 0
  failed_when:
    - create_role.rc != 0
    - "' already exists' not in create_role.stderr"
  loop: "{{ permissions_roles | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
