---
# The name of the root user used in Proxmox.
proxmox_root_user: "root"

# The password of the root user used in Proxmox.
proxmox_root_password: "{{ lookup('pipe', 'secret-tool lookup password ' + proxmox_root_password_id) }}"

# The user that will be used to connect on each host.
ansible_user: "{{ proxmox_root_user }}"

# At this point we don't have a SSH Keypair yet. So it is necessary to connect using the root's password.
ansible_password: "{{ proxmox_root_password }}"

# The size of the password that will be created.
ansible_password_size: 30

# All servers are located in Aracaju - Brazil. Maceio is the closest city.
timezone: "America/Maceio"

# This is a DNS for the Fortigate NTP server.
ntp_service: "chrony"
ntp_servers:
  - line: "pool 2.debian.pool.ntp.org iburst"
    state: "absent"
  - line: "pool ntp-pool.{{ domain }} iburst"
    state: "present"

vlan_catalog:
  - id: 1115
    bridge: "core"
    description: "DHCP, DNS, NTP"
  - id: 1120
    bridge: "ldap"
    description: "OpenLDAP"
  - id: 1125
    bridge: "proxy"
    description: "Proxy"
  - id: 1130
    bridge: "backup"
    description: "MinIO (Backup)"
  - id: 1135
    bridge: "repository"
    description: "Nexus (Repository)"
  - id: 1140
    bridge: "template"
    description: "Template Building"
  - id: 1145
    bridge: "jumpserver"
    description: "Guacamole (Jumpserver)"
  - id: 1150
    bridge: "ldbalancer"
    description: "Traefik (Load Balancer)"
  - id: 1155
    bridge: "monitor"
    description: "Prometheus, Grafana, Loki, Tempo"
  - id: 1160
    bridge: "security"
    description: "Vault, Wazuh, Authentik"
  - id: 1165
    bridge: "database"
    description: "PostgreSQL, SQL Server"
  - id: 1170
    bridge: "cicd"
    description: "Gitea, Jenkins"
  - id: 1175
    bridge: "kubernetes"
    description: "K8s Masters + Workers"
