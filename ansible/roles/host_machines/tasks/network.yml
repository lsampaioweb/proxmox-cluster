---
- name: "Validating the VLAN bridge names"
  ansible.builtin.assert:
    that:
      - item.bridge is defined
      - (item.bridge | default('')) is match('^[a-zA-Z][a-zA-Z0-9]{0,9}$')
      - >-
        item.bridge not in [cluster_nic | default(''), ceph_nic | default(''),
        vms_management_nic | default(''), wan_management_nic | default(''), 'lo', 'vmbr0']
  loop: "{{ vlan_catalog | default([]) }}"
  loop_control:
    label: "{{ item.id }}"

- name: "Validating unique VLAN bridge names and IDs"
  ansible.builtin.assert:
    that:
      - (vlan_catalog | default([]) | map(attribute='bridge') | unique | list | length) == (vlan_catalog | default([]) | length)
      - (vlan_catalog | default([]) | map(attribute='id') | unique | list | length) == (vlan_catalog | default([]) | length)

- name: "Copying the empty 99-default.link file to override the default configuration"
  ansible.builtin.copy:
    src: "99-default.link"
    dest: "/etc/systemd/network/"
    mode: "preserve"

- name: "Copying the .link rule file to inform the OS to always put the same name in the network cards based on the MAC address"
  ansible.builtin.template:
    src: "network-mac-bind.j2"
    dest: "/etc/systemd/network/10-{{ item.nic_name }}.link"
    mode: "preserve"
  vars:
    mac_address: "{{ item.mac_address }}"
    nic_name: "{{ item.nic_name }}"
  loop: "{{ mac_bind | default([]) }}"
  loop_control:
    label: "{{ item.nic_name }}"
  notify:
    - "Rebooting host"

- name: "Copying the network config file"
  ansible.builtin.template:
    src: "interfaces-{{ inventory_file | basename }}.j2"
    dest: "/etc/network/interfaces"
    mode: "preserve"
  notify:
    - "Reloading network"
    - "Waiting for the network device to reload"

- name: "Flushing all notified handlers at this point"
  ansible.builtin.meta: "flush_handlers"
