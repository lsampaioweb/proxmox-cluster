[defaults]
# Points to the home lab inventory.
inventory = inventory/home

# Enables execution timing and role profiling.
callbacks_enabled = timer, profile_roles

# Pinned to avoid interpreter discovery overhead.
interpreter_python = /usr/bin/python3

# All 7 nodes will run at the same time.
forks = 7

# Collect facts once per host per run; skip if already cached.
gathering = smart

# Prevent leftover retry files from cluttering the workspace.
retry_files_enabled = false

# Validate host identity against known_hosts on every connection.
host_key_checking = true

# Required for ansible-lint to resolve cross-role imports.
roles_path = roles

[ssh_connection]
# Reduce the number of SSH connections.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s

# Speed up task execution by reusing the SSH connection for sudo.
pipelining = true

# Abort a connection attempt after 30 seconds.
timeout = 30
