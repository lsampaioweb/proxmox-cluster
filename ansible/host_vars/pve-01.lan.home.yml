---
mac_bind:
  - mac_address: "60:be:b4:08:f7:66"
    nic_name: "enp2lacp0"
  - mac_address: "60:be:b4:08:f7:67"
    nic_name: "enp2lacp1"
  - mac_address: "60:be:b4:08:f7:68"
    nic_name: "enp2lacp2"
  - mac_address: "60:be:b4:08:f7:69"
    nic_name: "enp2lacp3"

wan_management_nic: "enp2lacp3"
wan_management_vlan: "1110"
wan_management_ip: "10.1.10.1"

bond0_nic: "enp2lacp0 enp2lacp1"
cluster_name: "Home"
cluster_nic: "bond0"
cluster_ip: "172.16.11.1"
cluster_netmask: "28"
cluster_ip_and_netmask: "{{ cluster_ip }}/{{ cluster_netmask }}"

vms_management_nic: "enp2lacp2"

migration_network: "172.16.11.0/28"

lvm: []

is_ceph_server: true
ceph_master_node: "{{ ansible_hostname }}"

ceph_devices:
  - name: "/dev/nvme0n1"
    type: "nvme"

ceph_crush_rules:
  - name: "nvme"
    type: "nvme"

ceph_pools:
  - name: "Ceph_Gold"
    crush_rule: "nvme"
    size: 2
    min_size: 1
    pg_autoscale_mode: "on"
    add_storages: true
    pg_num: "32"
  - name: "CephFS_data"
    crush_rule: "nvme"
    size: 2
    min_size: 1
    pg_autoscale_mode: "on"
    add_storages: false
    pg_num: "32"
  - name: "CephFS_metadata"
    crush_rule: "nvme"
    size: 2
    min_size: 1
    pg_autoscale_mode: "on"
    add_storages: false
    pg_num: "32"

ceph_file_systems:
  - name: "CephFS"
    pg_num: "32"

ha_groups:
  - name: "default"
    nodes: "pve-01,pve-02"
    comment: "The default HA group, all Proxmox hosts can run the VM."
